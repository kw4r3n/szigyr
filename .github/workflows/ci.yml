name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Five jobs in parallel; setup and the longest single test file (cli.test.ts) set the floor.
      matrix:
        include:
          - name: conformance 1/2
            run: pnpm typecheck && pnpm verify:conformance && SZIGYR_CONF_SHARD=1/2 pnpm conformance
          - name: conformance 2/2
            run: SZIGYR_CONF_SHARD=2/2 pnpm conformance
          - name: test 1/3
            run: pnpm test --shard=1/3
          - name: test 2/3
            run: pnpm test --shard=2/3
          - name: test 3/3
            run: pnpm test --shard=3/3
    steps:
      - uses: actions/checkout@v4
      - name: Install native & Wasm toolchains
        run: |
          # Install only when something is missing: apt-get update alone takes about 20 seconds.
          missing=
          for t in cc clang wasm-ld pkg-config; do command -v "$t" > /dev/null || missing="$missing $t"; done
          pkg-config --exists zlib || missing="$missing zlib"
          if [ -n "$missing" ]; then
            echo "missing:$missing"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential pkg-config clang lld zlib1g-dev
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.run }}
