name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Three jobs in parallel: the conformance job (about 2 minutes) sets the wall time, so a third test shard would not help.
      matrix:
        include:
          - name: conformance
            run: pnpm typecheck && pnpm verify:conformance && pnpm conformance
          - name: test 1/2
            run: pnpm test --shard=1/2
          - name: test 2/2
            run: pnpm test --shard=2/2
    steps:
      - uses: actions/checkout@v4
      - name: Install native & Wasm toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config clang lld zlib1g-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.run }}
